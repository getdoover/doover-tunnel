[package]
name = "doover-tunnel"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/getdoover/doover-tunnel"
description = "Doover tunnel protocol and peers: the device and client roles of a relay session, and the `doover-tunnel` binary behind `doover tunnel`."

[[bin]]
name = "doover-tunnel"
path = "src/bin/doover-tunnel.rs"
required-features = ["cli"]

[features]
default = []
# WebSocket adapter impl for axum's server-side socket (used by the relay).
axum-ws = ["dep:axum"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:reqwest", "dep:rustls", "tokio/process"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tokio-yamux = "0.3.20"
tokio-util = { version = "0.7.15", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
rmp-serde = "1.3"
thiserror = "1.0.69"
tracing = "0.1"
rand = "0.9.2"

axum = { version = "0.8.4", features = ["ws"], optional = true, default-features = false }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
# tokio-tungstenite links rustls without choosing a crypto provider; the CLI
# installs ring before its first wss dial.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
